name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install sqlfluff

      - name: 1. Lint SQL
        run: |
          FILES=$(git ls-files '*.sql')
          if [ -z "$FILES" ]; then echo "No SQL files yet"; exit 0; fi
          sqlfluff lint $FILES --dialect snowflake --nofail

      - name: 2. Check the app compiles
        run: |
          APP=$(git ls-files '*streamlit_app.py' | head -n 1)
          if [ -z "$APP" ]; then echo "No app file yet"; exit 0; fi
          python -m py_compile "$APP"

      - name: 3. Block secrets and key files
        run: |
          if grep -rniE "(password|private_key|secret|token)\s*=\s*['\"][^'\"]{8,}" \
               --include=*.py --include=*.sql --include=*.toml --include=*.yml . \
               --exclude-dir=.git --exclude-dir=.github ; then
            echo "Possible secret found. Remove it and use GitHub Secrets."
            exit 1
          fi
          if git ls-files | grep -iE "\.(p8|pem|key)$|rsa_key" ; then
            echo "A key file is committed. Delete it and make a new key."
            exit 1
          fi
          echo "No secrets found"

      - name: 4. Block DROP statements outside 00_reset.sql
        run: |
          if git ls-files '*.sql' | grep -v "00_reset.sql" | xargs -r grep -liE "DROP (DATABASE|SCHEMA|WAREHOUSE|TABLE)" ; then
            echo "DROP statement found outside 00_reset.sql"
            exit 1
          fi
          echo "No risky DROP statements"

      - name: 5. Check 08_rules.sql only creates views
        run: |
          RULES=$(git ls-files '*08_rules.sql' | head -n 1)
          if [ -z "$RULES" ]; then echo "08_rules.sql not added yet"; exit 0; fi
          if grep -iE "CREATE (OR REPLACE )?TABLE|INSERT INTO|DELETE FROM|TRUNCATE|UPDATE " "$RULES" ; then
            echo "08_rules.sql must only create views"
            exit 1
          fi
          echo "08_rules.sql is views only"
