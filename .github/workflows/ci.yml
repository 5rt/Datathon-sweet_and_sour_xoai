name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install sqlfluff

      - name: 1. Lint SQL
        run: sqlfluff lint sql/ --dialect snowflake --nofail

      - name: 2. Check the app compiles
        run: python -m py_compile app/streamlit_app.py

      - name: 3. Block secrets and key files
        run: |
          if grep -rniE "(password|private_key|secret|token)\s*=\s*['\"][^'\"]{8,}" \
               --include=*.py --include=*.sql --include=*.toml --include=*.yml . \
               --exclude-dir=.git --exclude-dir=.github ; then
            echo "Possible secret found. Remove it and use GitHub Secrets."
            exit 1
          fi
          if git ls-files | grep -iE "\.(p8|pem|key)$|rsa_key" ; then
            echo "A key file is committed. Delete it and make a new key."
            exit 1
          fi
          echo "No secrets found"

      - name: 4. Block DROP statements outside 00_reset.sql
        run: |
          if grep -rliE "DROP (DATABASE|SCHEMA|WAREHOUSE|TABLE)" sql/ | grep -v "00_reset.sql" ; then
            echo "DROP statement found outside 00_reset.sql"
            exit 1
          fi
          echo "No risky DROP statements"

      - name: 5. Check 08_rules.sql only creates views
        run: |
          if grep -iE "CREATE (OR REPLACE )?TABLE|INSERT INTO|DELETE FROM|TRUNCATE|UPDATE " sql/08_rules.sql ; then
            echo "08_rules.sql must only create views, because CD runs it on every merge"
            exit 1
          fi
          echo "08_rules.sql is views only"

      - name: 6. Check required files exist
        run: |
          for f in sql/08_rules.sql sql/09_tests.sql app/streamlit_app.py README.md; do
            if [ ! -f "$f" ]; then echo "Missing $f"; exit 1; fi
          done
          echo "All required files present"
