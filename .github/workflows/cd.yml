name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: snowflake-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
      SNOWFLAKE_ROLE: EVIDENCE_DEV
      SNOWFLAKE_WAREHOUSE: EVIDENCE_WH
      SNOWFLAKE_DATABASE: EVIDENCE_DB
      SNOWFLAKE_SCHEMA: CORE

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v1.5

      - name: Prepare the private key (fixes lost line breaks)
        env:
          KEY_IN: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          BODY=$(printf '%s' "$KEY_IN" \
            | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' \
            | tr -d ' \n\r\t')
          {
            echo "SNOWFLAKE_PRIVATE_KEY_RAW<<KEYEOF"
            echo "-----BEGIN PRIVATE KEY-----"
            echo "$BODY" | fold -w 64
            echo "-----END PRIVATE KEY-----"
            echo "KEYEOF"
          } >> "$GITHUB_ENV"

      - name: 1. Test the connection
        run: snow connection test -x

      - name: 2. Deploy the rules (08_rules.sql)
        run: snow sql -f "$(git ls-files '*08_rules.sql' | head -n 1)" -x --enable-templating NONE

      - name: 3. Run the data tests (09_tests.sql)
        run: |
          snow sql -f "$(git ls-files '*09_tests.sql' | head -n 1)" -x --enable-templating NONE --format json > test_results.json
          cat test_results.json
          FAILS=$(jq '[.. | objects | select(has("FAILURES")) | select(.FAILURES > 0)] | length' test_results.json)
          if [ "$FAILS" -gt 0 ]; then
            echo "$FAILS data test(s) failed"
            exit 1
          fi
          echo "All data tests passed"

      - name: 4. Smoke test
        run: |
          snow sql -q "SELECT COUNT(*) AS N FROM EVIDENCE_DB.CORE.HYPOTHESIS_SUMMARY" -x --enable-templating NONE --format json > smoke.json
          N=$(jq '[.. | objects | select(has("N")) | .N] | first' smoke.json)
          if [ "$N" -lt 1 ]; then
            echo "HYPOTHESIS_SUMMARY is empty"
            exit 1
          fi
          echo "Summary view has $N rows"
